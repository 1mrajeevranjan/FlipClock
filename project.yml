name: ClackClock
options:
  bundleIdPrefix: com.rajeevranjan
  # Marks the project as already on Xcode 27's recommended settings, so Xcode
  # doesn't offer the upgrade (and rewrite the generated project) again.
  xcodeVersion: "27.2"
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Version and build number live here and reach the bundle through
    # Info.plist's $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION). Bump
    # CURRENT_PROJECT_VERSION for every App Store Connect upload.
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    DEVELOPMENT_TEAM: SG8NYPLMNY
    # Xcode 27's recommended settings.
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
targets:
  ClackClock:
    type: application
    platform: macOS
    sources:
      - path: ClackClock
        # Exported builds saved into the source folder would otherwise be
        # copied into the app bundle — a nested .app is an App Store rejection.
        excludes:
          - "**/*.dmg"
          - "**/*.app"
      - path: Fonts
        buildPhase: resources
        # Xcode's resource copy phase flattens this folder's subdirectories
        # into a single Resources/ directory — several font packs ship a
        # same-named license/readme/preview file (READ_BEFORE_ANY_USE.txt,
        # README.txt, img/poster01.png, ...) that would collide once
        # flattened. Only the actual font files are needed at runtime, so
        # allowlisting extensions sidesteps every collision at once instead
        # of excluding each offending filename individually.
        includes:
          - "**/*.ttf"
          - "**/*.otf"
          - "**/*.TTF"
          - "**/*.OTF"
      - path: sun.png
        buildPhase: resources
      - path: moon.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajeevranjan.clackclock
        ENABLE_HARDENED_RUNTIME: YES
        # A real signing identity (not ad-hoc "Sign to Run Locally") is
        # required for TCC grants (Screen Recording, etc.) to survive a
        # rebuild — ad-hoc signing hashes the binary itself into the
        # designated requirement, so every rebuild looks like a brand-new
        # app to macOS and every permission has to be re-granted. Automatic
        # signing keeps that (same team) and lets Xcode manage the Mac App
        # Store provisioning profile when distributing.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    # The Mac App Store rejects any build without the sandbox. Nothing else is
    # needed: ScreenCaptureKit, notifications, SMAppService and reading
    # /System/Library/Sounds all work inside it without extra entitlements.
    entitlements:
      path: ClackClock/ClackClock.entitlements
      properties:
        com.apple.security.app-sandbox: true
    info:
      path: ClackClock/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: ClackClock
        LSApplicationCategoryType: public.app-category.productivity
        # No encryption beyond what macOS itself does — skips App Store Connect's export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        # Default to persistent "Alerts" (not auto-hiding banners) so the Dismiss button stays until the
        # user acts on a ringing reminder. Only applies on first registration; users can still change it.
        NSUserNotificationAlertStyle: alert
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: ""
  ClackClockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClackClockTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajeevranjan.clackclock.tests
        GENERATE_INFOPLIST_FILE: YES
        # Must match the host app's signing exactly — the test bundle is
        # dlopen'd into the app process, and macOS refuses to map a bundle
        # whose Team ID differs from the loading process ("mapping process
        # and mapped file (non-platform) have different Team IDs").
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
    dependencies:
      - target: ClackClock
schemes:
  ClackClock:
    build:
      targets:
        ClackClock: all
        ClackClockTests: [test]
    test:
      targets:
        - ClackClockTests
