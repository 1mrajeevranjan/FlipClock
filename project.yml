name: FlipClock
options:
  bundleIdPrefix: com.rajeevranjan
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
targets:
  FlipClock:
    type: application
    platform: macOS
    sources:
      - path: FlipClock
      - path: Fonts
        buildPhase: resources
        # Xcode's resource copy phase flattens this folder's subdirectories
        # into a single Resources/ directory — several font packs ship a
        # same-named license/readme/preview file (READ_BEFORE_ANY_USE.txt,
        # README.txt, img/poster01.png, ...) that would collide once
        # flattened. Only the actual font files are needed at runtime, so
        # allowlisting extensions sidesteps every collision at once instead
        # of excluding each offending filename individually.
        includes:
          - "**/*.ttf"
          - "**/*.otf"
          - "**/*.TTF"
          - "**/*.OTF"
      - path: sun.png
        buildPhase: resources
      - path: moon.png
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajeevranjan.flipclock
        ENABLE_HARDENED_RUNTIME: YES
        # A real signing identity (not ad-hoc "Sign to Run Locally") is
        # required for TCC grants (Screen Recording, etc.) to survive a
        # rebuild — ad-hoc signing hashes the binary itself into the
        # designated requirement, so every rebuild looks like a brand-new
        # app to macOS and every permission has to be re-granted. Manual
        # (not Automatic) signing since this is a personal, direct-run app
        # with no App Store provisioning profile to manage.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: SG8NYPLMNY
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FlipClock/Info.plist
      properties:
        LSUIElement: true
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""
  FlipClockTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: FlipClockTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rajeevranjan.flipclock.tests
        GENERATE_INFOPLIST_FILE: YES
        # Must match the host app's signing exactly — the test bundle is
        # dlopen'd into the app process, and macOS refuses to map a bundle
        # whose Team ID differs from the loading process ("mapping process
        # and mapped file (non-platform) have different Team IDs").
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: SG8NYPLMNY
    dependencies:
      - target: FlipClock
schemes:
  FlipClock:
    build:
      targets:
        FlipClock: all
        FlipClockTests: [test]
    test:
      targets:
        - FlipClockTests
